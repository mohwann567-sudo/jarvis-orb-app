<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JarvisOS</title>
<style>
  :root{
    --bg:#03142e; --card:#0A2147; --border:#1C3A6E; --text:#FFFFFF; --muted:#A9B8D6;
    --raise:#123060; --field:#051A3A; --line-strong:#3A5FA3;
    --etsy:#E8A44A; --ugc:#5B9BF5; --chars:#A48BF0;
    --ok:#4FB286;
    --sans:"Inter","Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.4}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)}

  .app{display:flex;flex-direction:column;gap:12px;height:100vh;padding:12px}

  /* header */
  .header{display:flex;align-items:center;gap:12px;flex-shrink:0;min-height:32px}
  .brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
  .brand svg{width:22px;height:22px;display:block}
  .chips{display:flex;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid var(--border);border-radius:999px;font-size:11px;color:var(--muted);white-space:nowrap}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
  .chip.ok{color:var(--text)} .chip.ok .dot{background:var(--ok)}
  .spacer{flex:1}
  .ctl{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--muted)}
  .ctl:hover{background:var(--card);color:var(--text)}
  .ctl.on{color:var(--text);border-color:var(--line-strong)}

  /* cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px}

  /* KPI row */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;flex-shrink:0}
  .kpi{padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
  .kpi .label{font-size:11px;color:var(--muted)}
  .kpi .value{font-family:var(--mono);font-size:20px;line-height:1.3;margin-top:2px}
  .kpi .src{font-size:10px;color:var(--muted);min-height:14px}
  .kpi svg.spark{width:100%;height:22px;margin-top:4px;display:block}

  /* body: left column (KPIs + agents) and right sidebar (console) */
  .body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;flex:1;min-height:0}
  .left{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
  .main{display:grid;grid-template-columns:260px 1fr;gap:12px;flex:1;min-height:0}
  .agents{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .section-title{font-size:11px;color:var(--muted);padding:4px 8px 6px}
  .row{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:6px;border-left:2px solid transparent}
  .row:hover{background:var(--raise)}
  .row.sel{background:var(--raise);border-left-color:var(--accent,var(--muted))}
  .row .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .row .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .status{font-size:11px;color:var(--muted)}
  .row.branch{padding-left:30px}
  .row.branch .dot{width:6px;height:6px}

  .detail{padding:16px;overflow-y:auto;min-width:0}
  .crumbs{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:10px}
  .crumbs button{color:var(--muted);padding:0}
  .crumbs button:hover{color:var(--text);text-decoration:underline}
  .dhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .dhead .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .dhead h2{font-size:16px;font-weight:600}
  .pill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11px;color:var(--muted);border:1px solid var(--border);border-top:1px solid var(--border);box-shadow:inset 0 -2px 0 0 var(--accent)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
  .tile{background:var(--field);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
  .tile .label{font-size:11px;color:var(--muted)}
  .tile .value{font-family:var(--mono);font-size:18px;margin-top:2px}
  .tile .src{font-size:10px;color:var(--muted);margin-top:1px}
  .empty{border:1px dashed var(--line-strong);border-radius:8px;padding:16px;color:var(--muted);font-size:12px}
  .blist{display:flex;flex-direction:column;gap:6px}
  .brow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--field)}
  .brow:hover{background:var(--raise)}
  .brow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .brow .name{flex:1}
  .brow .chev{color:var(--muted)}
  .stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}

  /* console */
  .console{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
  .console-head{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
  .console-head .title{font-size:13px;font-weight:600;color:var(--text)}
  .console-head .last{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);min-height:15px}
  .log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;padding:2px 2px 2px 0}
  .log:empty::before{content:"No messages yet.";color:var(--muted)}
  .line{word-break:break-word;display:flex;flex-direction:column;gap:2px}
  .line .who{color:var(--muted);font-size:11px}
  .line.jarvis .who{color:var(--text)}
  .inputrow{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:4px 4px 4px 8px;background:var(--field);flex-shrink:0}
  .inputrow:focus-within{border-color:var(--line-strong)}
  .mode{padding:3px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--muted);flex-shrink:0}
  .mode:hover{color:var(--text)}
  .chat-input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:12px;padding:4px 0}
  .chat-input::placeholder{color:var(--muted)}
  .send{padding:4px 12px;border:1px solid var(--border);border-radius:6px;font-size:11px;flex-shrink:0}
  .send:hover{background:var(--raise)}

  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  @media (max-width:900px){ .body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 240px} }
  @media (max-width:640px){ .main{grid-template-columns:1fr} .agents{max-height:150px} .stages{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
</head>
<body>
<div class="app">

  <!-- 1. Header bar -->
  <div class="header" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <svg viewBox="0 0 1024 1024" fill="none" stroke="currentColor" stroke-width="64" aria-hidden="true">
        <rect x="160" y="160" width="704" height="704" rx="160"/>
        <path d="M470 330 H680 M575 330 V610 A105 105 0 0 1 365 610 V575" stroke-linecap="butt" stroke-linejoin="miter"/>
      </svg>
      <span data-tauri-drag-region>JarvisOS</span>
    </div>
    <div class="chips" data-tauri-drag-region>
      <span class="chip" id="chipConn"><span class="dot"></span><span id="chipConnText">Core offline</span></span>
      <span class="chip" id="chipState"><span class="dot"></span><span id="chipStateText">&mdash;</span></span>
    </div>
    <div class="spacer" data-tauri-drag-region></div>
    <button class="ctl" id="pinBtn" onclick="togglePin()"><span id="pinLabel">Pin off</span></button>
    <button class="ctl on" id="frameBtn" onclick="toggleFrame()"><span id="frameLabel">Frame on</span></button>
  </div>

  <div class="body">
  <div class="left">
    <!-- 2. KPI row -->
    <div class="kpis" id="kpis"></div>

    <!-- 3. Agents + detail -->
    <div class="main">
      <div class="card agents" id="agents"></div>
      <div class="card detail" id="detail"></div>
    </div>
  </div>

  <!-- 4. Console: right sidebar -->
  <div class="card console">
    <div class="console-head">
      <span class="title">Console</span>
      <span class="last" id="lastCmd"></span>
    </div>
    <div class="log" id="chatHistory"></div>
    <div class="inputrow">
      <button class="mode" id="modeBtn" onclick="toggleMode()">CMD</button>
      <input type="text" class="chat-input" id="chatInput" placeholder="Type a command" autocomplete="off" spellcheck="false" />
      <button class="send" onclick="sendChat()">Send</button>
    </div>
  </div>
  </div><!-- /body -->

</div>
<script>
  const DASH = '—';

  /* ---------- static structure (no metrics) ---------- */
  const AGENTS = [
    { id:'etsy',  name:'Etsy Agent',    color:'#E8A44A', branches:[{ id:'redrunswest', name:'RedRunsWest' }] },
    { id:'ugc',   name:'UGC Bot',       color:'#5B9BF5', branches:[] },
    { id:'chars', name:'AI Characters', color:'#A48BF0', branches:[] }
  ];
  const STAGES = ['Research', 'Designs', 'In review', 'Queued', 'Live'];
  const NO_FEED = 'No feed from Core yet';

  function el(tag, cls, text){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined) e.textContent = text;
    return e;
  }

  /* ---------- header: window controls ---------- */
  let pinned = false;
  let framed = true;
  async function togglePin(){
    pinned = !pinned;
    try { await window.__TAURI__.window.getCurrentWindow().setAlwaysOnTop(pinned); }
    catch(e){ console.error('setAlwaysOnTop failed', e); }
    document.getElementById('pinLabel').textContent = pinned ? 'Pin on' : 'Pin off';
    document.getElementById('pinBtn').classList.toggle('on', pinned);
  }
  async function toggleFrame(){
    framed = !framed;
    try { await window.__TAURI__.window.getCurrentWindow().setDecorations(framed); }
    catch(e){ console.error('setDecorations failed', e); }
    document.getElementById('frameLabel').textContent = framed ? 'Frame on' : 'Frame off';
    document.getElementById('frameBtn').classList.toggle('on', framed);
  }

  /* ---------- header: status chips (real socket + core state) ---------- */
  let connected = false;
  let coreState = null;   // 'idle' | 'thinking' | null (unknown)
  function renderChips(){
    const conn = document.getElementById('chipConn');
    conn.classList.toggle('ok', connected);
    document.getElementById('chipConnText').textContent = connected ? 'Core connected' : 'Core offline';
    const st = document.getElementById('chipState');
    st.classList.toggle('ok', connected && coreState === 'thinking');
    let label = DASH;
    if(connected){ label = (coreState === 'thinking') ? 'Thinking' : 'Idle'; }
    document.getElementById('chipStateText').textContent = label;
  }

  /* ---------- KPI row: real values only ---------- */
  const commandTimes = [];            // timestamps of commands sent from this HUD
  const sessionStart = Date.now();
  function sparkSvg(buckets){
    const w = 100, h = 22, max = Math.max(1, ...buckets);
    const pts = buckets.map((v, i) => (i * w / (buckets.length - 1)).toFixed(1) + ',' + (h - 2 - (v / max) * (h - 4)).toFixed(1)).join(' ');
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
           '<polyline points="' + pts + '" fill="none" stroke="#A9B8D6" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
  }
  function emptySpark(){
    return '<svg class="spark" viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true">' +
           '<line x1="0" y1="11" x2="100" y2="11" stroke="#2C4A8A" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/></svg>';
  }
  function renderKpis(){
    const now = Date.now();
    const buckets = new Array(20).fill(0);                    // commands per minute, last 20 minutes
    commandTimes.forEach(t => { const age = Math.floor((now - t) / 60000); if(age >= 0 && age < 20){ buckets[19 - age]++; } });
    const up = Math.floor((now - sessionStart) / 1000);
    const uptime = [Math.floor(up / 3600), Math.floor((up % 3600) / 60), up % 60].map(n => String(n).padStart(2, '0')).join(':');
    const tiles = [
      { label:'Monthly token cost', value:DASH, src:'Source: core usage log (not on bridge)', spark:emptySpark() },
      { label:'Monthly revenue',    value:DASH, src:'Source: revenue tracker (not on bridge)', spark:emptySpark() },
      { label:'Commands this session', value:String(commandTimes.length), src:'Source: this HUD, ' + uptime, spark:sparkSvg(buckets) },
      { label:'Skills fired',       value:DASH, src:'Source: core skill log (not on bridge)', spark:emptySpark() },
      { label:'Daily tasks',        value:DASH, src:'Source: task list (not on bridge)', spark:emptySpark() }
    ];
    const host = document.getElementById('kpis');
    host.innerHTML = '';
    tiles.forEach(t => {
      const c = el('div', 'card kpi');
      c.appendChild(el('div', 'label', t.label));
      c.appendChild(el('div', 'value', t.value));
      c.appendChild(el('div', 'src', t.src));
      const s = el('div'); s.innerHTML = t.spark; c.appendChild(s.firstChild);
      host.appendChild(c);
    });
  }

  /* ---------- agents list + detail ---------- */
  const view = { agent:'etsy', branch:null };
  function agentById(id){ return AGENTS.find(a => a.id === id); }

  function renderAgents(){
    const host = document.getElementById('agents');
    host.innerHTML = '';
    host.appendChild(el('div', 'section-title', 'Agents'));
    AGENTS.forEach(a => {
      const r = el('button', 'row' + (view.agent === a.id && !view.branch ? ' sel' : ''));
      r.style.setProperty('--accent', a.color);
      r.dataset.agent = a.id;
      r.appendChild(el('span', 'dot'));
      r.appendChild(el('span', 'name', a.name));
      r.appendChild(el('span', 'status', 'No data'));
      host.appendChild(r);
      a.branches.forEach(b => {
        const br = el('button', 'row branch' + (view.agent === a.id && view.branch === b.id ? ' sel' : ''));
        br.style.setProperty('--accent', a.color);
        br.dataset.agent = a.id; br.dataset.branch = b.id;
        br.appendChild(el('span', 'dot'));
        br.appendChild(el('span', 'name', b.name));
        br.appendChild(el('span', 'status', 'No data'));
        host.appendChild(br);
      });
    });
  }

  function tile(label, value, src){
    const t = el('div', 'tile');
    t.appendChild(el('div', 'label', label));
    t.appendChild(el('div', 'value', value));
    if(src){ t.appendChild(el('div', 'src', src)); }
    return t;
  }

  function renderDetail(){
    const host = document.getElementById('detail');
    host.innerHTML = '';
    const a = agentById(view.agent);
    host.style.setProperty('--accent', a.color);

    if(view.branch){
      const b = a.branches.find(x => x.id === view.branch);
      const crumbs = el('div', 'crumbs');
      const back = el('button', '', a.name);
      back.dataset.agent = a.id; back.dataset.back = '1';
      crumbs.appendChild(back);
      crumbs.appendChild(el('span', '', '/'));
      crumbs.appendChild(el('span', '', b.name));
      host.appendChild(crumbs);

      const head = el('div', 'dhead');
      head.appendChild(el('span', 'dot'));
      head.appendChild(el('h2', '', b.name));
      head.appendChild(el('span', 'pill', 'No data'));
      host.appendChild(head);

      host.appendChild(el('div', 'section-title', 'Pipeline'));
      const stages = el('div', 'stages');
      STAGES.forEach(s => stages.appendChild(tile(s, DASH, 'No feed')));
      host.appendChild(stages);
      return;
    }

    const head = el('div', 'dhead');
    head.appendChild(el('span', 'dot'));
    head.appendChild(el('h2', '', a.name));
    head.appendChild(el('span', 'pill', 'No data'));
    host.appendChild(head);

    const tiles = el('div', 'tiles');
    tiles.appendChild(tile('Branches', String(a.branches.length), 'Configured'));
    tiles.appendChild(tile('Revenue', DASH, NO_FEED));
    tiles.appendChild(tile('Last run', DASH, NO_FEED));
    host.appendChild(tiles);

    host.appendChild(el('div', 'section-title', 'Branches'));
    if(a.branches.length === 0){
      host.appendChild(el('div', 'empty', 'No branches yet. Branches (shops, clients, channels) appear here once this agent has them.'));
    } else {
      const list = el('div', 'blist');
      a.branches.forEach(b => {
        const r = el('button', 'brow');
        r.dataset.agent = a.id; r.dataset.branch = b.id;
        r.appendChild(el('span', 'dot'));
        r.appendChild(el('span', 'name', b.name));
        r.appendChild(el('span', 'status muted', 'No data'));
        r.appendChild(el('span', 'chev', '›'));
        list.appendChild(r);
      });
      host.appendChild(list);
    }
  }

  function select(agentId, branchId){
    view.agent = agentId; view.branch = branchId || null;
    renderAgents(); renderDetail();
  }
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-agent]');
    if(!t) return;
    if(t.dataset.back){ select(t.dataset.agent, null); return; }
    select(t.dataset.agent, t.dataset.branch || null);
  });

  /* ---------- console ---------- */
  let chatMode = 'cmd';
  function toggleMode(){
    chatMode = (chatMode === 'cmd') ? 'chat' : 'cmd';
    document.getElementById('modeBtn').textContent = chatMode.toUpperCase();
  }
  let chatItems = [];
  function renderLog(){
    const log = document.getElementById('chatHistory');
    log.innerHTML = '';
    chatItems.forEach(item => {
      const l = el('div', 'line ' + item.role);
      l.appendChild(el('span', 'who', item.role === 'you' ? 'You' : 'JarvisOS'));
      l.appendChild(document.createTextNode(item.text));
      log.appendChild(l);
    });
    log.scrollTop = log.scrollHeight;
  }
  function appendChat(role, text){
    chatItems.push({ role, text });
    if(chatItems.length > 40){ chatItems = chatItems.slice(-40); }
    renderLog();
  }
  function setLast(text){ document.getElementById('lastCmd').textContent = text ? 'Last: ' + text : ''; }

  let ws_global = null;
  function sendChat(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;
    appendChat('you', text);
    commandTimes.push(Date.now());
    renderKpis();
    if(ws_global && ws_global.readyState === 1){
      ws_global.send(JSON.stringify({ type: chatMode === 'chat' ? 'chat_message' : 'text_command', value: text }));
    } else {
      appendChat('jarvis', 'Core is not connected. Message not sent.');
    }
    input.value = '';
  }
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('chatInput').addEventListener('keydown', (e) => { if(e.key === 'Enter'){ sendChat(); } });
  });

  /* ---------- WebSocket bridge (protocol unchanged) ---------- */
  (function connectBridge(){
    function connect(){
      const ws = new WebSocket('ws://localhost:8765');
      ws_global = ws;
      ws.addEventListener('open', () => { connected = true; renderChips(); });
      ws.addEventListener('message', (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if(msg.type === 'state'){ coreState = (msg.value === 'thinking') ? 'thinking' : 'idle'; renderChips(); }
        else if(msg.type === 'cmd'){ setLast(msg.value); }
        else if(msg.type === 'chat_response'){ appendChat('jarvis', msg.value); }
      });
      ws.addEventListener('close', () => { connected = false; coreState = null; renderChips(); setTimeout(connect, 1500); });
      ws.addEventListener('error', () => ws.close());
    }
    connect();
  })();

  /* ---------- init ---------- */
  renderChips(); renderKpis(); renderAgents(); renderDetail(); renderLog();
  setInterval(renderKpis, 5000);
</script>
</body>
</html>
